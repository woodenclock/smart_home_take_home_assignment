services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: dorm_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - dorm_network
    restart: unless-stopped

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: dorm_zigbee2mqtt
    depends_on:
      - mosquitto
    environment:
      - TZ=Asia/Singapore
    volumes:
      - ./zigbee2mqtt/data:/app/data
      - ./zigbee2mqtt/configuration.yaml:/app/data/configuration.yaml
    ports:
      - "8080:8080"
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    privileged: true
    networks:
      - dorm_network
    restart: unless-stopped

  mqtt_bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    container_name: dorm_mqtt_bridge
    depends_on:
      - mosquitto
      - zigbee2mqtt
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - ZIGBEE_DEVICE_NAME=smart_plug
    networks:
      - dorm_network
    restart: unless-stopped

  lighting_controller:
    build: .
    container_name: dorm_lighting_controller
    depends_on:
      - mosquitto
      - zigbee2mqtt
      - mqtt_bridge
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    networks:
      - dorm_network
    restart: unless-stopped

networks:
  dorm_network:
    driver: bridge
