services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: dorm_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  lighting_controller:
    build: .
    container_name: dorm_lighting_controller
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    restart: unless-stopped